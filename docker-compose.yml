version: "3.9"

services:
  octoprint:
    build:
      context: ./octoprint
      dockerfile: Dockerfile
      network: host

    container_name: octoprint

    restart: unless-stopped

    privileged: true

    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "5000:5000"
      - "8080:8080"

    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"

    environment:
      ENABLE_MJPG_STREAMER: "true"
      MJPG_STREAMER_INPUT: "input_uvc.so -d /dev/video0 -r 1920x1080 -f 30"
      MJPG_STREAMER_OUTPUT: "output_http.so -w /opt/mjpg-streamer/mjpg-streamer-experimental/www -p 8080"

    volumes:
      - octoprint_data:/octoprint

volumes:
  octoprint_data:
